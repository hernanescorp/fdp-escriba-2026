[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "missed-delivery"
version = "0.1.0"
description = "Temporal feature engineering and batch inference for Missed Delivery risk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.1",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "joblib==1.5.3",
    "PyYAML==6.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["missed_delivery*"]
